<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Calendar</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    margin-top: 40px;
    background: #f4f4f4;
  }

  .calendar {
    width: 320px;
    background: white;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header button {
    background: #007bff;
    color: white;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 4px;
  }

  .header h2 {
    margin: 0;
    font-size: 18px;
  }

  .days, .dates {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    margin-top: 10px;
  }

  .days div {
    font-weight: bold;
    font-size: 14px;
  }

  .dates div {
    padding: 8px;
    margin: 2px;
    border-radius: 4px;
    cursor: pointer;
  }

  .dates div:hover {
    background: #e0e0e0;
  }

  .today {
    background: #007bff;
    color: white;
  }
</style>
</head>
<body>

<div class="calendar">
  <div class="header">
    <button onclick="prevMonth()">❮</button>
    <h2 id="monthYear"></h2>
    <button onclick="nextMonth()">❯</button>
  </div>

  <div class="days">
    <div>Sun</div><div>Mon</div><div>Tue</div>
    <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>

  <div class="dates" id="dates"></div>
</div>

<script>
  let date = new Date();

  function renderCalendar() {
    const monthYear = document.getElementById("monthYear");
    const dates = document.getElementById("dates");

    dates.innerHTML = "";

    const year = date.getFullYear();
    const month = date.getMonth();

    monthYear.innerText = date.toLocaleString("default", {
      month: "long",
      year: "numeric"
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      dates.innerHTML += "<div></div>";
    }

    for (let day = 1; day <= lastDate; day++) {
      const today = new Date();
      let className = "";

      if (
        day === today.getDate() &&
        month === today.getMonth() &&
        year === today.getFullYear()
      ) {
        className = "today";
      }

      dates.innerHTML += `<div class="${className}">${day}</div>`;
    }
  }

  function prevMonth() {
    date.setMonth(date.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    date.setMonth(date.getMonth() + 1);
    renderCalendar();
  }

  renderCalendar();
</script>

</body>
</html>
